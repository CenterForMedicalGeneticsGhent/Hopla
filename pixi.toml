[workspace]
name = "hopla"
version = "2.0.0"
description = "Genomic family analysis and interactive reporting"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]

[dependencies]
r-base = ">=4.4,<5"
r-vcfr = ">=1.16"
"r-data.table" = ">=1.17"
r-rcolorbrewer = ">=1.1_3"
r-kinship2 = ">=1.9"
r-plotly = ">=4.12"
r-htmltools = ">=0.5"
r-base64enc = ">=0.1_3"
r-scales = ">=1.4"
bioconductor-genomicranges = ">=1.54"
bioconductor-dnacopy = ">=1.76"
r-jsonlite = ">=2.0.0,<3"
r-yaml = ">=2.3.12,<3"
r-jsonvalidate = ">=1.5.0,<2"
merlin = "1.1.2.*"

[tasks]
hopla = "Rscript exec/hopla"
convert = "Rscript exec/hopla convert"
concordance = "Rscript exec/hopla concordance"
transform = "Rscript exec/hopla transform"

[feature.dev.dependencies]
r-testthat = ">=3.3.2,<4"
r-lintr = ">=3.2,<4"

[feature.dev.tasks]
check = "R CMD build . && R CMD check --no-manual hopla_2.0.0.tar.gz"
lint = "Rscript tools/lint.R"

[environments]
default = []
dev = ["dev"]
