[workspace]
name = "hopla"
version = "2.1.0"
description = "Genomic family analysis and interactive reporting"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]

[feature.hopla-py.dependencies]
python = ">=3.12,<3.14"
cyvcf2 = "*"
jinja2 = "*"
jsonschema = "*"
numpy = "*"
polars = "*"
pydantic = ">=2"
plotly = "*"
pyarrow = "*"
pybigwig = "*"
pyyaml = "*"
starlette = "*"
typer = "*"
uvicorn = "*"
pip = "*"
merlin = "1.1.2.*"

[feature.hopla-py-dev.dependencies]
mypy = "*"
pytest = "*"
ruff = "*"
types-pyyaml = "*"
types-jsonschema = "*"
httpx2 = ">=2.12.0,<3"

[feature.hopla-py.tasks]
install-py = { cmd = "python -m pip install --no-deps -e hopla-py" }
hopla-py = { cmd = "python -m hopla.cli", cwd = "hopla-py", depends-on = ["install-py"] }
hopla = { cmd = "hopla", depends-on = ["install-py"] }
convert = { cmd = "hopla convert", depends-on = ["install-py"] }
concordance = { cmd = "hopla concordance", depends-on = ["install-py"] }
transform = { cmd = "hopla transform", depends-on = ["install-py"] }
serve = { cmd = "hopla serve", depends-on = ["install-py"] }

[feature.hopla-py-dev.tasks]
lint-py = { cmd = "ruff check hopla-py && mypy hopla-py/src", depends-on = ["install-py"] }
test-py = { cmd = "pytest hopla-py/tests", depends-on = ["install-py"] }

[environments]
default = ["hopla-py"]
dev = ["hopla-py", "hopla-py-dev"]
hopla-py = { features = ["hopla-py"], no-default-feature = true }
hopla-py-dev = { features = ["hopla-py", "hopla-py-dev"], no-default-feature = true }
