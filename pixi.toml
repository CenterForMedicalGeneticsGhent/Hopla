[workspace]
name = "hopla"
version = "3.0.0"
description = "Genomic family analysis and interactive reporting"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]

[dependencies]
python = ">=3.12,<3.14"
cyvcf2 = "*"
jinja2 = "*"
jsonschema = "*"
numpy = "*"
polars = "*"
pydantic = ">=2"
plotly = "*"
pyarrow = "*"
pybigwig = "*"
pyyaml = "*"
starlette = "*"
typer = "*"
uvicorn = "*"
pip = "*"
merlin = "1.1.2.*"

[pypi-dependencies]
hopla = { path = ".", editable = true }

[feature.dev.dependencies]
mypy = "*"
pytest = "*"
ruff = "*"
types-pyyaml = "*"
types-jsonschema = "*"
httpx2 = ">=2.12.0,<3"

[tasks]
hopla = { cmd = "hopla" }
convert = { cmd = "hopla convert" }
concordance = { cmd = "hopla concordance" }
transform = { cmd = "hopla transform" }
serve = { cmd = "hopla serve" }

[feature.dev.tasks]
lint-py = { cmd = "ruff check src tests && mypy src" }
test-py = { cmd = "pytest tests" }

[environments]
dev = ["dev"]
