[workspace]
name = "hopla"
version = "2.0.0"
description = "Genomic family analysis and interactive reporting"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]

[feature.hopla-py.dependencies]
python = ">=3.12,<3.14"
cyvcf2 = "*"
jsonschema = "*"
numpy = "*"
polars = "*"
pydantic = ">=2"
plotly = "*"
pyarrow = "*"
pybigwig = "*"
pyyaml = "*"
typer = "*"
pip = "*"
merlin = "1.1.2.*"

[feature.hopla-py-dev.dependencies]
mypy = "*"
pytest = "*"
ruff = "*"
types-pyyaml = "*"
types-jsonschema = "*"

[feature.hopla-py.tasks]
install = { cmd = "python -m pip install --no-deps -e hopla-py" }
hopla-py = { cmd = "python -m hopla.cli", cwd = "hopla-py", depends-on = ["install"] }
hopla = { cmd = "hopla", depends-on = ["install"] }
convert = { cmd = "hopla convert", depends-on = ["install"] }
concordance = { cmd = "hopla concordance", depends-on = ["install"] }
transform = { cmd = "hopla transform", depends-on = ["install"] }

[feature.hopla-py-dev.tasks]
lint-py = { cmd = "ruff check hopla-py && mypy hopla-py/src", depends-on = ["install"] }
test-py = { cmd = "pytest hopla-py/tests", depends-on = ["install"] }

[feature.hopla-ui.dependencies]
nodejs = ">=22.12,<23"

[feature.hopla-ui.tasks]
install = { cmd = "corepack yarn install --frozen-lockfile", cwd = "hopla-ui" }
lint = { cmd = "corepack yarn lint", cwd = "hopla-ui", depends-on = ["install"] }
test = { cmd = "corepack yarn test:unit", cwd = "hopla-ui", depends-on = ["install"] }
build = { cmd = "corepack yarn build", cwd = "hopla-ui", depends-on = ["install"] }
serve = { cmd = "corepack yarn serve", cwd = "hopla-ui", depends-on = ["install"] }

[environments]
default = ["hopla-py"]
dev = ["hopla-py", "hopla-py-dev"]
hopla-py = { features = ["hopla-py"], no-default-feature = true }
hopla-py-dev = { features = ["hopla-py", "hopla-py-dev"], no-default-feature = true }
hopla-ui = { features = ["hopla-ui"], no-default-feature = true }
