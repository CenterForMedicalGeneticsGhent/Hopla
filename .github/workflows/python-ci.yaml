name: Python package CI

on:
  pull_request:
    branches: [main, 2.0.0]
    paths:
      - "hopla-py/**"
      - "pixi.toml"
      - "pixi.lock"
      - ".github/workflows/python-ci.yaml"
  push:
    branches: [main, master]
    paths:
      - "hopla-py/**"
      - "pixi.toml"
      - "pixi.lock"
      - ".github/workflows/python-ci.yaml"

permissions:
  contents: read

jobs:
  package:
    name: Lint, test, and build Python package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.77.1
          cache: true
          locked: true
          environments: hopla-py-dev

      - name: Lint and type-check
        run: pixi run -e hopla-py-dev lint-py

      - name: Test
        run: pixi run -e hopla-py-dev test-py

      - name: Build wheel
        run: pixi run -e hopla-py-dev python -m pip wheel --no-deps ./hopla-py -w dist

      - uses: actions/upload-artifact@v4
        with:
          name: hopla-python-wheel
          path: dist/*.whl
