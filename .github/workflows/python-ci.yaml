name: Python package CI

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "example/**"
      - "pyproject.toml"
      - "pixi.lock"
      - "Dockerfile"
      - ".github/workflows/python-ci.yaml"
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "tests/**"
      - "example/**"
      - "pyproject.toml"
      - "pixi.lock"
      - "Dockerfile"
      - ".github/workflows/python-ci.yaml"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    name: Lint, test, and build Python package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.77.1
          cache: true
          locked: true
          environments: dev

      - name: Lint and type-check
        run: pixi run -e dev lint-py

      - name: Test
        run: pixi run -e dev test-py

      - name: Build wheel
        run: pixi run -e dev python -m pip wheel --no-deps . -w dist

      - name: Upload Python wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: hopla-python-wheel
          path: dist/*.whl

      - name: Attach Python wheel to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl

  image:
    name: Build and publish Python image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: "."
          file: Dockerfile
          load: true
          tags: hopla:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: docker run --rm hopla:${GITHUB_SHA} hopla -V

      - name: Test Docker image without entrypoint
        run: |
          docker run --rm --entrypoint /bin/sh hopla:${GITHUB_SHA} -c \
            'set -e; for tool in python python3 hopla merlin minx; do command -v "$tool"; done; hopla -V'

      - name: Save Docker image artifact
        run: |
          mkdir -p dist
          docker save hopla:${GITHUB_SHA} | gzip -9 > dist/hopla-image-linux-64.tar.gz

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: hopla-docker-image
          path: dist/hopla-image-linux-64.tar.gz

      - name: Log in to Quay
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Publish Docker tags
        if: github.event_name != 'pull_request'
        env:
          IMAGE: quay.io/cmgg/hopla
        run: |
          tags=("$IMAGE:${GITHUB_SHA}")
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            package_version="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -n1)"
            tags+=("$IMAGE:${package_version}" "$IMAGE:stable")
          else
            tags+=("$IMAGE:latest")
          fi
          for tag in "${tags[@]}"; do
            docker tag "hopla:${GITHUB_SHA}" "$tag"
            docker push "$tag"
          done

      - name: Attach Docker image to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/hopla-image-linux-64.tar.gz
