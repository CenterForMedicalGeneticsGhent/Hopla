name: UI package CI

on:
  pull_request:
    branches: [main]
    paths:
      - "hopla-ui/**"
      - "pixi.toml"
      - "pixi.lock"
      - ".github/workflows/ui-ci.yaml"
  push:
    branches: [main, master]
    paths:
      - "hopla-ui/**"
      - "pixi.toml"
      - "pixi.lock"
      - ".github/workflows/ui-ci.yaml"
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, test, and build UI package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.77.1
          cache: true
          locked: true
          environments: hopla-ui

      - run: pixi run -e hopla-ui lint
      - run: pixi run -e hopla-ui test
      - run: pixi run -e hopla-ui build

  image:
    name: Build and publish UI image
    runs-on: ubuntu-24.04
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./hopla-ui
          load: true
          tags: hopla:ui-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log in to Quay
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Publish Docker tags
        if: github.event_name != 'pull_request'
        env:
          IMAGE: quay.io/cmgg/hopla
        run: |
          tags=("$IMAGE:ui-${GITHUB_SHA}")
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            package_version="$(jq -r .version hopla-ui/package.json)"
            tags+=("$IMAGE:ui-${package_version}" "$IMAGE:ui-stable")
          else
            tags+=("$IMAGE:ui-latest")
          fi
          for tag in "${tags[@]}"; do
            docker tag "hopla:ui-${GITHUB_SHA}" "$tag"
            docker push "$tag"
          done
